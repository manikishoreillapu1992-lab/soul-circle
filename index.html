<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#202c33" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Soul Circle</title>
  <style>
    :root { --bg:#0b141a; --header:#202c33; --user:#005c4b; --bot:#202c33; --text:#e9edef; --muted:#8696a0; --accent:#00a884; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    html, body { height:100%; background:var(--bg); color:var(--text); overflow:hidden; }
    .app { display:flex; flex-direction:column; height:100dvh; max-width:500px; margin:0 auto; background:var(--bg); }
    header { background:var(--header); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a3942; }
    .title h1 { font-size:16px; font-weight:700; }
    .title p { font-size:11px; color:var(--accent); margin-top:2px; }
    .h-btns { display:flex; gap:5px; }
    .btn-sm { background:#2a3942; color:var(--text); border:none; padding:6px 9px; border-radius:8px; font-size:12px; cursor:pointer; }
    .channels { display:flex; gap:6px; overflow-x:auto; padding:8px 10px; background:#131c21; border-bottom:1px solid #1f2c33; }
    .channels::-webkit-scrollbar { display:none; }
    .pill { background:#202c33; color:#e9edef; border:1px solid #2a3942; padding:5px 11px; border-radius:16px; font-size:12px; white-space:nowrap; cursor:pointer; }
    .pill.active { background:#005c4b; border-color:var(--accent); font-weight:600; }
    .chat-box { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; background:radial-gradient(circle at top, #132029, #0b141a); }
    .msg { max-width:83%; padding:9px 12px; border-radius:12px; font-size:14.5px; line-height:1.42; word-wrap:break-word; }
    .msg.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:2px; }
    .msg.bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:2px; cursor:pointer; }
    .msg.system { align-self:center; background:#182229; color:var(--muted); font-size:11.5px; text-align:center; max-width:92%; }
    .sender { font-size:12px; font-weight:700; margin-bottom:3px; }
    .ref { font-size:11.5px; color:#a8c7fa; font-style:italic; margin-top:6px; display:block; }
    .meta { display:flex; justify-content:flex-end; align-items:center; gap:6px; margin-top:3px; font-size:10px; color:#9aa7b0; }
    .react { background:#111b21; padding:1px 6px; border-radius:10px; font-size:12px; }
    .att-img { max-width:210px; max-height:220px; border-radius:8px; margin-bottom:6px; display:block; object-fit:cover; }
    .att-doc { background:rgba(0,0,0,0.28); padding:6px 10px; border-radius:8px; font-size:12px; margin-bottom:6px; display:inline-block; }
    .preview-bar { display:none; background:#182229; padding:8px 12px; border-top:1px solid #2a3942; align-items:center; justify-content:space-between; font-size:12px; }
    .input-bar { background:var(--header); padding:8px 10px; display:flex; gap:6px; align-items:center; }
    input { background:#2a3942; color:var(--text); border:none; border-radius:20px; padding:10px 14px; font-size:15px; outline:none; }
    .input-bar input[type="text"] { flex:1; }
    .att-btn { background:#2a3942; color:#e9edef; border:none; width:38px; height:38px; border-radius:50%; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .send { background:var(--accent); color:#0b141a; border:none; padding:10px 15px; border-radius:20px; font-weight:700; font-size:13px; cursor:pointer; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.82); align-items:center; justify-content:center; padding:16px; z-index:20; }
    .card { background:var(--header); padding:18px; border-radius:16px; width:100%; max-width:380px; max-height:85vh; overflow-y:auto; }
    .card h3 { font-size:16px; margin-bottom:6px; }
    .card p { font-size:12px; color:var(--muted); margin-bottom:10px; line-height:1.4; }
    .card input { width:100%; border-radius:10px; margin-bottom:8px; font-size:14px; }
    .mem-item { background:#131c21; padding:8px 10px; border-radius:8px; margin-bottom:6px; font-size:12.5px; display:flex; justify-content:space-between; align-items:center; border-left:3px solid var(--accent); }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <h1 id="headTitle">🕊️ Soul Circle</h1>
      <p id="subStatus">Krishna, Jesus, Shiva, Buddha, Noor</p>
    </div>
    <div class="h-btns">
      <button class="btn-sm" onclick="openModal('memModal')">🧠 <span id="memCnt">0</span></button>
      <button class="btn-sm" onclick="openModal('profModal')">👤</button>
      <button class="btn-sm" onclick="openModal('apiModal')">⚙️</button>
    </div>
  </header>

  <div class="channels" id="channelBar"></div>
  <div class="chat-box" id="chatBox"></div>

  <div class="preview-bar" id="previewBar">
    <span id="previewLabel">📎 File ready</span>
    <button class="btn-sm" onclick="clearAttachment()">✕</button>
  </div>

  <div class="input-bar">
    <input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.txt,.csv,.md" onchange="handleFile(event)" />
    <button class="att-btn" onclick="document.getElementById('fileInput').click()">📎</button>
    <input type="text" id="msgInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button class="send" onclick="sendMessage()">Send</button>
  </div>
</div>

<div class="modal" id="apiModal">
  <div class="card">
    <h3>🔑 Free Gemini API Key</h3>
    <p>aistudio.google.com free key ikkada paste cheyi (₹0 cost).</p>
    <input type="text" id="apiKeyInput" placeholder="AIza..." />
    <div class="actions">
      <button class="btn-sm" onclick="closeModal('apiModal')">Close</button>
      <button class="send" onclick="saveKey()">Save</button>
    </div>
  </div>
</div>

<div class="modal" id="profModal">
  <div class="card">
    <h3>👤 Your Details (Optional)</h3>
    <p>Astrology / Panchangam & personal vibe kosam.</p>
    <input type="text" id="pName" placeholder="Your Name" />
    <input type="text" id="pCity" placeholder="Current City (e.g., Hyderabad)" />
    <input type="text" id="pDob" placeholder="DOB (DD-MM-YYYY)" />
    <input type="text" id="pTime" placeholder="Birth Time (e.g., 08:30 AM)" />
    <input type="text" id="pPlace" placeholder="Birth Place" />
    <div class="actions">
      <button class="btn-sm" onclick="closeModal('profModal')">Cancel</button>
      <button class="send" onclick="saveProfile()">Save</button>
    </div>
  </div>
</div>

<div class="modal" id="memModal">
  <div class="card">
    <h3>🧠 Long-Term Memories</h3>
    <p>3-5+ days back cheppina vishayalu ikkada untayi.</p>
    <div id="memList"></div>
    <div class="actions">
      <button class="btn-sm" style="color:#ff8a80;" onclick="clearAllChats()">Clear Chats</button>
      <button class="btn-sm" onclick="closeModal('memModal')">Close</button>
    </div>
  </div>
</div>

<script>
  const FREE_MODELS = ["gemini-3.6-flash", "gemini-3.5-flash-lite", "gemini-4-hydrogen", "gemini-3.8-flash"];
  const CHANNELS = [
    { id: "group", label: "🕊️ Group" },
    { id: "Krishna", label: "🦚 Krishna" },
    { id: "Jesus", label: "✝️ Jesus" },
    { id: "Shiva", label: "🔱 Shiva" },
    { id: "Buddha", label: "🪷 Buddha" },
    { id: "Noor", label: "🌙 Noor" }
  ];
  const PERSONAS = {
    Krishna: { color: "#64b5f6", emoji: "🦚" },
    Jesus:   { color: "#ffd54f", emoji: "✝️" },
    Shiva:   { color: "#ce93d8", emoji: "🔱" },
    Buddha:  { color: "#81c784", emoji: "🪷" },
    Noor:    { color: "#4db6ac", emoji: "🌙" }
  };

  let chatMode = "group";
  let allChats = JSON.parse(localStorage.getItem("sc_all_chats") || "{}");
  let memories = JSON.parse(localStorage.getItem("sc_memories") || "[]");
  let profile = JSON.parse(localStorage.getItem("sc_profile") || "{}");
  let pendingFile = null; // { name, mimeType, base64, previewUrl, textContent }

  function getLiveTime() {
    const n = new Date(), h = n.getHours();
    const p = h < 5 ? "Late Night" : h < 12 ? "Morning" : h < 17 ? "Afternoon" : h < 21 ? "Evening" : "Night";
    return `${n.toLocaleString("en-IN", { weekday:"long", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:true })} (${p})`;
  }

  function buildPrompt() {
    const mems = memories.length ? memories.map(m => `- [${m.date}]: ${m.text}`).join("\n") : "None yet.";
    const prof = `Name: ${profile.name||"Friend"}, City: ${profile.city||"India"}, DOB: ${profile.dob||"-"}, Time: ${profile.birth_time||"-"}, Place: ${profile.birth_place||"-"}`;
    const modeRule = chatMode === "group"
      ? `GROUP CHAT: Krishna, Jesus, Shiva, Buddha, Noor are in one WhatsApp group. Pick 1-2 (max 3) friends to reply. Let them react to each other like real bros.`
      : `PRIVATE 1-ON-1 DM: Speak ONLY as ${chatMode}.`;

    return `You are simulating a REAL WhatsApp group chat "Soul Circle" where Krishna, Jesus, Shiva, Buddha, and Noor talk like the user's closest human friends (with their authentic divine wisdom & acharalu).
${modeRule}

STRICT ANTI-ROBOT RULES:
1. NEVER sound like an AI assistant or customer support!
   BANNED PHRASES: "I understand how you feel", "I am here for you", "Remember that", "Let me help you", "Take a deep breath", "First let me", "Feel free to share", "That sounds tough".
2. TALK LIKE REAL WHATSAPP TEXTING:
   - Keep replies SHORT & punchy (1-2 casual lines usually!). Sometimes 2 quick back-to-back texts from the same person.
   - Match user's language (natural everyday Tenglish like "arey, orey, cheppu ra, avuna?, lite teesko, em ayyindi?" if they use Tenglish, or casual English if they use English).
   - Example: User says "hello first let me introduce myself" -> Krishna: "Haan cheppu ra, vintunna!" | Jesus: "Hey! Cool, cheppu nee gurinchi 😄" (NO big welcome speeches!).
   - Example: User says "sad ga undi" -> Jesus: "Arey em ayyindi? Intlo godava leka work tension aa?" (ask first like a real friend, don't dump a 5-step lecture before knowing the problem!).
3. 3-MODE SOLUTIONS:
   - Casual chat: Pure chill friends. Zero gyan.
   - Practical problems (career, boss, money, breakup, documents/screenshots): Give direct, real-life step-by-step fixes. NO forced scripture quotes!
   - Deep spiritual/ethical/astrology questions: Stay 100% true to each tradition (Krishna=Vedic/Gita/Jyotishya, Shiva=Yogic blunt truth, Jesus=Grace/Prayer/no astrology, Buddha=Mindfulness/no rituals, Noor=Quranic Sabr/Tawakkul/no astrology) and explain clearly & in detail ONLY when relevant.
4. IMAGES & DOCUMENTS: If user sends an image/PDF/document, read it carefully and react naturally like friends checking a photo/file in WhatsApp!
5. TOUGH LOVE: Lovingly stop the user if they are doing something wrong/harmful. Crisis/self-harm -> share India Tele-MANAS 14416.

PROFILE: ${prof}
TIME NOW: ${getLiveTime()}
MEMORIES:
${mems}

Return ONLY JSON:
{"user_reaction":"","replies":[{"sender":"${chatMode==="group"?"Krishna":chatMode}","message":"...","reference":""}],"new_memory":""}`;
  }

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";

    if (file.type.startsWith("image/")) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxW = 900;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
          pendingFile = { name: file.name, mimeType: "image/jpeg", base64: dataUrl.split(",")[1], previewUrl: dataUrl };
          showPreview(`🖼️ ${file.name}`);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    } else if (file.type === "application/pdf") {
      if (file.size > 4 * 1024 * 1024) { alert("PDF 4MB kante thakkuva undali dude."); return; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        pendingFile = { name: file.name, mimeType: "application/pdf", base64: ev.target.result.split(",")[1] };
        showPreview(`📄 ${file.name}`);
      };
      reader.readAsDataURL(file);
    } else {
      const reader = new FileReader();
      reader.onload = (ev) => {
        pendingFile = { name: file.name, mimeType: "text/plain", textContent: ev.target.result.slice(0, 15000) };
        showPreview(`📄 ${file.name}`);
      };
      reader.readAsText(file);
    }
  }

  function showPreview(label) {
    document.getElementById("previewLabel").textContent = label;
    document.getElementById("previewBar").style.display = "flex";
  }
  function clearAttachment() {
    pendingFile = null;
    document.getElementById("previewBar").style.display = "none";
  }

  function renderChannels() {
    document.getElementById("channelBar").innerHTML = CHANNELS.map(c =>
      `<button class="pill ${chatMode===c.id?"active":""}" onclick="switchChannel('${c.id}')">${c.label}</button>`
    ).join("");
    document.getElementById("headTitle").textContent = chatMode === "group" ? "🕊️ Soul Circle" : `🔒 DM: ${chatMode}`;
    document.getElementById("subStatus").textContent = chatMode === "group" ? "Krishna, Jesus, Shiva, Buddha, Noor" : "Private 1-on-1 Space";
  }

  function switchChannel(id) { chatMode = id; renderChannels(); renderChat(); }

  function renderChat() {
    const box = document.getElementById("chatBox");
    const msgs = allChats[chatMode] || [];
    box.innerHTML = `<div class="msg system">${chatMode==="group"?"🕊️ Soul Circle • Say Hai, or share photos & docs (📎)!":"🔒 Private DM with "+chatMode}</div>`;
    msgs.forEach(m => box.appendChild(createMsgEl(m)));
    document.getElementById("memCnt").textContent = memories.length;
    box.scrollTop = box.scrollHeight;
  }

  function createMsgEl(m) {
    const d = document.createElement("div");
    d.className = `msg ${m.type}`;
    if (m.type === "user") {
      let attHtml = "";
      if (m.imgThumb) attHtml = `<img class="att-img" src="${m.imgThumb}" />`;
      else if (m.docName) attHtml = `<div class="att-doc">📄 ${esc(m.docName)}</div>`;
      d.innerHTML = `${attHtml}<div>${esc(m.text)}</div><div class="meta">${m.reaction?`<span class="react">${m.reaction}</span>`:""}<span>${m.time} ✓✓</span></div>`;
    } else {
      const meta = PERSONAS[m.sender] || { color:"#fff", emoji:"✨" };
      d.onclick = () => { if (confirm(`Report this AI message from ${m.sender}?`)) alert("Reported!"); };
      d.innerHTML = `<div class="sender" style="color:${meta.color}">${meta.emoji} ${m.sender}</div><div>${esc(m.text)}</div>${m.reference?`<span class="ref">📖 ${esc(m.reference)}</span>`:""}<div class="meta"><span>${m.time}</span></div>`;
    }
    return d;
  }

  function esc(s) { return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function saveChats() {
    try { localStorage.setItem("sc_all_chats", JSON.stringify(allChats)); }
    catch {
      // If storage full due to images, strip old image thumbnails & retry
      for (const k in allChats) {
        allChats[k] = allChats[k].slice(-30).map(m => ({ ...m, imgThumb: undefined }));
      }
      try { localStorage.setItem("sc_all_chats", JSON.stringify(allChats)); } catch {}
    }
  }

  async function callGeminiFast(contents) {
    const apiKey = localStorage.getItem("sc_api_key");
    let lastErr = "Network busy, try again.";
    for (const model of FREE_MODELS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 14000);
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
          method: "POST",
          signal: controller.signal,
          headers: { "Content-Type":"application/json", "x-goog-api-key": apiKey },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: buildPrompt() }] },
            contents,
            generationConfig: {
              responseMimeType: "application/json",
              thinkingConfig: { thinkingLevel: "LOW" }
            }
          })
        });
        clearTimeout(timer);
        const json = await res.json();
        if (!json.error && json?.candidates?.[0]?.content?.parts?.[0]?.text) return json;
        lastErr = json?.error?.message || lastErr;
        if (json?.error?.code === 400 || json?.error?.code === 403 || /API key/i.test(lastErr)) break;
      } catch (err) {
        clearTimeout(timer);
        lastErr = err.name === "AbortError" ? "Slow network, retrying..." : err.message;
      }
    }
    throw new Error(lastErr);
  }

  async function sendMessage() {
    const inp = document.getElementById("msgInput");
    const text = inp.value.trim();
    const fileToSend = pendingFile;
    if (!text && !fileToSend) return;

    inp.value = "";
    clearAttachment();

    const timeNow = new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
    if (!allChats[chatMode]) allChats[chatMode] = [];

    const userMsg = {
      id: Date.now(), type:"user", text: text || (fileToSend.previewUrl ? "" : `Sent ${fileToSend.name}`),
      imgThumb: fileToSend?.previewUrl || "", docName: (!fileToSend?.previewUrl && fileToSend?.name) ? fileToSend.name : "",
      time: timeNow, reaction: ""
    };
    allChats[chatMode].push(userMsg);
    saveChats(); renderChat();

    const apiKey = localStorage.getItem("sc_api_key");
    const sub = document.getElementById("subStatus");
    if (!apiKey) {
      allChats[chatMode].push({ type:"bot", sender:"Krishna", text:"Arey ⚙️ nokki free Gemini API key pettu ra mundu!", reference:"", time:timeNow });
      saveChats(); renderChat(); return;
    }

    sub.textContent = "typing...";
    try {
      const historyMsgs = allChats[chatMode].slice(-12);
      const contents = historyMsgs.map((m, idx) => {
        const isLast = idx === historyMsgs.length - 1;
        if (m.type === "user") {
          const parts = [];
          let msgText = m.text || "";
          if (isLast && fileToSend?.textContent) msgText += `\n\n[Attached File "${fileToSend.name}"]:\n${fileToSend.textContent}`;
          if (msgText) parts.push({ text: msgText });
          if (isLast && fileToSend?.base64) parts.push({ inlineData: { mimeType: fileToSend.mimeType, data: fileToSend.base64 } });
          if (parts.length === 0) parts.push({ text: "Check this attachment" });
          return { role: "user", parts };
        }
        return { role: "model", parts: [{ text: `${m.sender}: ${m.text}` }] };
      });

      const data = await callGeminiFast(contents);
      const raw = (data?.candidates?.[0]?.content?.parts?.[0]?.text || "{}").replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(raw);

      if (parsed.user_reaction) { userMsg.reaction = parsed.user_reaction; saveChats(); renderChat(); }
      for (const r of parsed.replies || []) {
        sub.textContent = `${r.sender} typing...`;
        await new Promise(res => setTimeout(res, 250));
        allChats[chatMode].push({
          id: Date.now()+Math.random(), type:"bot", sender:r.sender,
          text:r.message, reference:r.reference||"",
          time: new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })
        });
        saveChats(); renderChat();
      }
      if (parsed.new_memory && parsed.new_memory.trim()) {
        const dt = new Date().toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" });
        memories.push({ date:dt, text:parsed.new_memory.trim() });
        memories = memories.slice(-30);
        localStorage.setItem("sc_memories", JSON.stringify(memories));
        document.getElementById("memCnt").textContent = memories.length;
      }
    } catch (e) {
      alert("Error: " + e.message);
    } finally {
      sub.textContent = chatMode === "group" ? "Krishna, Jesus, Shiva, Buddha, Noor" : "Private 1-on-1 Space";
    }
  }

  function openModal(id) {
    if (id === "apiModal") document.getElementById("apiKeyInput").value = localStorage.getItem("sc_api_key") || "";
    if (id === "profModal") {
      document.getElementById("pName").value = profile.name || "";
      document.getElementById("pCity").value = profile.city || "";
      document.getElementById("pDob").value = profile.dob || "";
      document.getElementById("pTime").value = profile.birth_time || "";
      document.getElementById("pPlace").value = profile.birth_place || "";
    }
    if (id === "memModal") {
      document.getElementById("memList").innerHTML = memories.length
        ? memories.map((m,i) => `<div class="mem-item"><div><small style="color:#00a884;">${m.date}</small><br>${esc(m.text)}</div><button class="btn-sm" onclick="delMem(${i})">✕</button></div>`).join("")
        : "<p>Inka em memories save avvaledu.</p>";
    }
    document.getElementById(id).style.display = "flex";
  }
  function closeModal(id) { document.getElementById(id).style.display = "none"; }
  function saveKey() { localStorage.setItem("sc_api_key", document.getElementById("apiKeyInput").value.trim()); closeModal("apiModal"); }
  function saveProfile() {
    profile = {
      name: document.getElementById("pName").value, city: document.getElementById("pCity").value,
      dob: document.getElementById("pDob").value, birth_time: document.getElementById("pTime").value,
      birth_place: document.getElementById("pPlace").value
    };
    localStorage.setItem("sc_profile", JSON.stringify(profile));
    closeModal("profModal");
  }
  function delMem(i) { memories.splice(i,1); localStorage.setItem("sc_memories", JSON.stringify(memories)); openModal("memModal"); document.getElementById("memCnt").textContent = memories.length; }
  function clearAllChats() { if (confirm("Clear all chats?")) { allChats = {}; saveChats(); renderChat(); closeModal("memModal"); } }

  renderChannels();
  renderChat();
</script>
</body>
</html>
